name: Build & Release Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (for example v1.6.0.4)'
        required: false
        default: 'v1.6.0.4'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Installers (.exe & .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test frontend helpers
        run: node --test loomwright-window/web/*.test.mjs

      - name: Set release version
        id: release-version
        shell: pwsh
        env:
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:INPUT_TAG_NAME) {
            $tag = $env:INPUT_TAG_NAME
          } elseif ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = 'v1.6.0.4'
          }

          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Release tag must contain four or five numeric version parts, for example v1.6.0.4."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup NSIS
        uses: nsis-dev/setup-nsis@v1
        with:
          version: 'latest'

      - name: Setup WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset -y
          $wixDir = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
            Select-Object -Last 1 -ExpandProperty FullName
          if (-not $wixDir -or -not (Test-Path "$wixDir\bin\candle.exe") -or -not (Test-Path "$wixDir\bin\light.exe")) {
            throw "WiX Toolset v3 was not installed."
          }
          "$wixDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build app and both installers
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          .\tools\build-installers.ps1 -Version $env:RELEASE_VERSION

      - name: Smoke-test NSIS installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exeInstaller = Join-Path $env:GITHUB_WORKSPACE "installer\Loomwright-Setup-$env:RELEASE_VERSION.exe"
          $exeInstall = Join-Path $env:RUNNER_TEMP "loomwright-nsis-smoke"
          Write-Host "Installing EXE to $exeInstall"
          $install = Start-Process -FilePath $exeInstaller -ArgumentList @('/S', "/D=$exeInstall") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installation failed with exit code $($install.ExitCode)." }
          $exe = Join-Path $exeInstall 'loomwright.exe'
          if (-not (Test-Path $exe) -or (Get-Item $exe).VersionInfo.ProductVersion -ne $env:RELEASE_VERSION) {
            throw "NSIS installation did not produce the expected Loomwright executable."
          }
          if (-not (Test-Path (Join-Path $exeInstall 'Uninstall.exe'))) { throw "NSIS uninstaller is missing." }
          Write-Host 'NSIS install smoke test passed.'

      - name: Smoke-test MSI installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msiInstaller = Join-Path $env:GITHUB_WORKSPACE "installer\Loomwright-Setup-$env:RELEASE_VERSION.msi"
          $msiInstall = Join-Path $env:LOCALAPPDATA 'Programs\Loomwright'
          $installLog = Join-Path $env:RUNNER_TEMP 'loomwright-msi-install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'loomwright-msi-uninstall.log'
          function Write-MsiDiagnostics {
            foreach ($logPath in @($installLog, $uninstallLog)) {
              if (Test-Path $logPath) {
                $tail = Get-Content $logPath -Tail 100
                Write-Host "Last 100 lines of $logPath"
                $tail | ForEach-Object { Write-Host $_ }
                @(
                  "### $([System.IO.Path]::GetFileName($logPath)) (last 100 lines)"
                  '```text'
                  $tail
                  '```'
                ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
              }
            }
          }

          Write-Host "Installing MSI to $msiInstall"
          $install = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/i', "`"$msiInstaller`"", '/qn', '/norestart', '/l*v', "`"$installLog`"") -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            Write-MsiDiagnostics
            throw "MSI installation failed with exit code $($install.ExitCode)."
          }
          $exe = Join-Path $msiInstall 'loomwright.exe'
          if (-not (Test-Path $exe) -or (Get-Item $exe).VersionInfo.ProductVersion -ne $env:RELEASE_VERSION) {
            Write-MsiDiagnostics
            throw "MSI installation did not produce the expected Loomwright executable."
          }
          Write-Host 'MSI installation smoke test passed. Uninstalling test installation.'
          $uninstall = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/x', "`"$msiInstaller`"", '/qn', '/norestart', '/l*v', "`"$uninstallLog`"") -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) {
            Write-MsiDiagnostics
            throw "MSI uninstallation failed with exit code $($uninstall.ExitCode)."
          }
          if (Test-Path $exe) {
            Write-MsiDiagnostics
            throw "MSI uninstallation did not remove the Loomwright executable."
          }
          Write-Host 'MSI install/uninstall smoke test passed.'

      - name: Upload MSI smoke-test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Loomwright-MSI-Smoke-Test-Log-${{ github.run_id }}
          path: ${{ runner.temp }}/loomwright-msi-*.log
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Loomwright-Windows-Installers-${{ steps.release-version.outputs.version }}
          path: |
            installer/Loomwright-Setup-${{ steps.release-version.outputs.version }}.exe
            installer/Loomwright-Setup-${{ steps.release-version.outputs.version }}.msi
            installer/checksums.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-version.outputs.tag }}
          name: Loomwright ${{ steps.release-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          body: |
            ## Loomwright Desktop v${{ steps.release-version.outputs.version }}

            Native Windows writing desk for books, characters, and story threads.

            ### Downloads
            - **EXE Installer (recommended):** [Loomwright-Setup-${{ steps.release-version.outputs.version }}.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.release-version.outputs.tag }}/Loomwright-Setup-${{ steps.release-version.outputs.version }}.exe)
            - **MSI Installer:** [Loomwright-Setup-${{ steps.release-version.outputs.version }}.msi](https://github.com/${{ github.repository }}/releases/download/${{ steps.release-version.outputs.tag }}/Loomwright-Setup-${{ steps.release-version.outputs.version }}.msi)
            - **SHA-256 checksums:** [checksums.txt](https://github.com/${{ github.repository }}/releases/download/${{ steps.release-version.outputs.tag }}/checksums.txt)

            ### Highlights
            - Veritas now has project-wide story memory while preserving chapter-specific memory and chat history.
            - Explicit links let Veritas compare text and continuity across up to five chapters.
            - Metrics, Characters, and Story Web keep separate project-scoped conversations.
            - Ignores contents-page entries and preliminary pages when splitting imported manuscripts into chapters.
            - Starts with an empty project library and no sample chapters.
            - Offers first-use guides for Projects, Writing, Metrics, Characters, Story Web, and Finalise.
            - Per-user installation; no administrator privileges required.
            - Includes both the NSIS `.exe` setup and Windows Installer `.msi`.
            - Safe upgrades preserve user manuscripts.

            ![Loomwright writing desk](https://github.com/${{ github.repository }}/blob/${{ steps.release-version.outputs.tag }}/docs/window.png?raw=true)
            ![Veritas chapter memory](https://github.com/${{ github.repository }}/blob/${{ steps.release-version.outputs.tag }}/docs/veritas-memory.png?raw=true)
          files: |
            installer/Loomwright-Setup-${{ steps.release-version.outputs.version }}.exe
            installer/Loomwright-Setup-${{ steps.release-version.outputs.version }}.msi
            installer/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
