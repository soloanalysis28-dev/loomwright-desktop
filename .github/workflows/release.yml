name: Build & Release Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.6.0)'
        required: false
        default: 'v1.6.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Installers (.exe & .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup NSIS
        uses: nsis-dev/setup-nsis@v1
        with:
          version: 'latest'

      - name: Setup WiX Toolset
        shell: pwsh
        run: |
          if (Test-Path "$env:WIX\bin") {
            "$env:WIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (Test-Path "C:\Program Files (x86)\WiX Toolset v3.11\bin") {
            "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            choco install wixtoolset -y
            "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build release executable
        shell: pwsh
        run: |
          cd loomwright-window
          cargo build --release
          if (-not (Test-Path "target\release\loomwright.exe")) {
            throw "loomwright.exe was not created."
          }
          Write-Host "loomwright.exe built successfully."

      - name: Build NSIS Installer (.exe)
        shell: pwsh
        run: |
          cd installer
          makensis /DVERSION=1.6.0 loomwright.nsi
          if (-not (Test-Path "Loomwright-Setup-1.6.0.exe")) {
            throw "Loomwright-Setup-1.6.0.exe was not created."
          }
          Write-Host "Loomwright-Setup-1.6.0.exe built successfully."

      - name: Build WiX Installer (.msi)
        shell: pwsh
        continue-on-error: true
        run: |
          cd installer
          $candleOut = & candle -dVersion=1.6.0 loomwright.wxs -out loomwright.wixobj 2>&1 | Out-String
          Write-Host "CANDLE OUTPUT:`n$candleOut"
          $lightOut = & light -sval loomwright.wixobj -out Loomwright-Setup-1.6.0.msi 2>&1 | Out-String
          Write-Host "LIGHT OUTPUT:`n$lightOut"
          "### WiX Build Log`n**Candle:**`n``````n$candleOut``````n**Light:**`n``````n$lightOut``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if (-not (Test-Path "Loomwright-Setup-1.6.0.msi")) {
            Write-Warning "Loomwright-Setup-1.6.0.msi was not created."
          } else {
            Write-Host "Loomwright-Setup-1.6.0.msi built successfully."
          }

      - name: Generate Checksums
        shell: pwsh
        run: |
          cd installer
          $files = Get-ChildItem -Path . -Filter "Loomwright-Setup-1.6.0.*" | Where-Object { $_.Extension -in '.exe', '.msi' } | Select-Object -ExpandProperty FullName
          Get-FileHash -Algorithm SHA256 $files | Format-Table -AutoSize | Out-String | Out-File -FilePath checksums.txt
          Get-Content checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Loomwright-1.6.0-Windows-Installers
          path: |
            installer/Loomwright-Setup-1.6.0.exe
            installer/Loomwright-Setup-1.6.0*.msi
            installer/checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.6.0' }}
          name: Loomwright 1.6.0
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## Loomwright Desktop v1.6.0

            Native Windows writing desk for books, characters, and story threads.

            ### Downloads
            - 📦 **EXE Installer (recommended):** [Loomwright-Setup-1.6.0.exe](https://github.com/${{ github.repository }}/releases/download/v1.6.0/Loomwright-Setup-1.6.0.exe)
            - 📦 **MSI Installer:** [Loomwright-Setup-1.6.0.msi](https://github.com/${{ github.repository }}/releases/download/v1.6.0/Loomwright-Setup-1.6.0.msi)

            ### Highlights
            - **Clean slate on start**: Starts with zero pre-loaded or dummy data.
            - **Per-user installation**: Does not require administrator privileges.
            - **Both formats**: Standard NSIS `.exe` setup and Windows Installer `.msi` package.
            - **Safe upgrades**: Cleans leftover test/dummy data while preserving existing user manuscripts.
          files: |
            installer/Loomwright-Setup-1.6.0.exe
            installer/Loomwright-Setup-1.6.0*.msi
            installer/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
